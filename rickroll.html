<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem Video Gốc</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        .play-button {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            background-color: #ff0000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .play-button:hover {
            background-color: #cc0000;
            transform: scale(1.05);
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .video-box {
            position: relative;
            width: 85%;
            max-width: 800px;
            aspect-ratio: 16/9;
        }
        .video-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .close-btn {
            position: absolute;
            top: -45px; right: 0;
            color: #fff;
            font-size: 40px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Nút bấm nổi bật giữa màn hình -->
        <button class="play-button" onclick="openVideo()">BẤM VÀO ĐÂY ĐỂ XEM VIDEO</button>
    </div>

    <!-- Khung ẩn chứa video Rick Roll lấy từ link của bạn -->
    <div id="videoOverlay" class="overlay" onclick="closeVideoOutside(event)">
        <div class="video-box">
            <span class="close-btn" onclick="closeVideo()">&times;</span>
            <iframe id="ytPlayer" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Sử dụng ID video Rick Astley dựa theo tab trình duyệt của bạn
        const videoId = "dQw4w9WgXcQ"; 
        const overlay = document.getElementById('videoOverlay');
        const player = document.getElementById('ytPlayer');

        function openVideo() {
            player.src = `https://www.youtube.com/watch?v=dQw4w9WgXcQ`;
            overlay.style.display = 'flex';
        }

        function closeVideo() {
            player.src = "";
            overlay.style.display = 'none';
        }

        function closeVideoOutside(e) {
            if (e.target.id === 'videoOverlay') {
                closeVideo();
            }
        }
    </script>

</body>
</html>
